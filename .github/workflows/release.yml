name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      is_stable: ${{ steps.check.outputs.is_stable }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Validate stable release tag
        id: check
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_stable=true" >> "$GITHUB_OUTPUT"
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "is_stable=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

  build-linux-amd64:
    runs-on: ubuntu-24.04
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system deps
        run: |
          sudo apt update
          sudo apt install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Go modules
        run: go mod tidy

      - name: Frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Stamp version
        run: bash build/scripts/set-version.sh "${{ needs.validate-tag.outputs.version }}"

      - name: Build binary and .deb
        env:
          GOARCH: amd64
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: wails3 task linux:create:deb

      - name: Collect Linux artifacts
        run: |
          mkdir -p dist
          cp bin/nooboo dist/NooBoo-linux-amd64
          cp bin/*.deb dist/NooBoo-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-amd64
          path: dist/*

  build-macos:
    runs-on: macos-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Go modules
        run: go mod tidy

      - name: Frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Stamp version
        run: bash build/scripts/set-version.sh "${{ needs.validate-tag.outputs.version }}"

      - name: Build .app bundles and DMGs
        run: |
          mkdir -p dist
          for ARCH in arm64 amd64; do
            rm -rf bin/nooboo.app "dist/stage-$ARCH"
            wails3 task darwin:package ARCH=$ARCH
            mkdir -p "dist/stage-$ARCH"
            ditto bin/nooboo.app "dist/stage-$ARCH/NooBoo.app"
            ln -s /Applications "dist/stage-$ARCH/Applications"
            hdiutil create -volname "NooBoo" -srcfolder "dist/stage-$ARCH" \
              -ov -format UDZO "dist/NooBoo-macos-$ARCH.dmg"
          done
          rm -rf dist/stage-*

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-macos
          path: dist/*.dmg

  build-windows-amd64:
    runs-on: windows-latest
    needs: validate-tag
    if: needs.validate-tag.outputs.is_stable == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          $candidates = @(
            "$env:ChocolateyInstall\bin",
            "${env:ProgramFiles(x86)}\NSIS",
            "$env:ProgramFiles\NSIS"
          )
          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              Add-Content -Path $env:GITHUB_PATH -Value $candidate
              $env:PATH = "$candidate;$env:PATH"
            }
          }
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            throw "makensis not found after NSIS installation"
          }

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Go modules
        run: go mod tidy

      - name: Frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Generate bindings
        run: wails3 generate bindings -f '-tags production' -clean=true -ts

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Stamp version
        run: bash build/scripts/set-version.sh "${{ needs.validate-tag.outputs.version }}"

      - name: Build portable binary and NSIS installer
        env:
          CGO_ENABLED: "0"
          GOOS: windows
          GOARCH: amd64
        run: wails3 task windows:create:nsis:installer

      - name: Collect Windows artifacts
        run: |
          mkdir -p dist
          cp bin/nooboo.exe dist/NooBoo-windows-amd64.exe
          # project.nsi writes the installer into bin/ as ${INFO_PROJECTNAME}-${ARCH}-installer.exe,
          # and the project name comes from build/windows/info.json, so match it instead of guessing.
          installer=$(ls bin/*installer*.exe 2>/dev/null | head -n 1)
          if [ -z "$installer" ]; then
            echo "no installer in bin/, makensis did not run"
            exit 1
          fi
          cp "$installer" dist/NooBoo-windows-amd64-installer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-windows-amd64
          path: dist/*

  cleanup-tag-on-failure:
    runs-on: ubuntu-latest
    needs:
      - build-linux-amd64
      - build-macos
      - build-windows-amd64
    if: |
      always() && (
        needs.build-linux-amd64.result == 'failure' ||
        needs.build-macos.result == 'failure' ||
        needs.build-windows-amd64.result == 'failure'
      )
    permissions:
      contents: write
    steps:
      - name: Delete tag
        run: |
          git -c "http.extraHeader=Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            push origin --delete "${{ github.ref_name }}" || true

  release:
    runs-on: ubuntu-latest
    needs:
      - validate-tag
      - build-linux-amd64
      - build-macos
      - build-windows-amd64
    if: needs.validate-tag.outputs.is_stable == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Collect artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Verify artifacts
        run: |
          cd dist
          missing=0
          for f in NooBoo-linux-amd64 NooBoo-linux-amd64.deb \
                   NooBoo-macos-arm64.dmg NooBoo-macos-amd64.dmg \
                   NooBoo-windows-amd64.exe NooBoo-windows-amd64-installer.exe; do
            if [ ! -f "$f" ]; then
              echo "missing: $f"
              missing=1
            fi
          done
          exit $missing

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Build changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)

          # The API is what knows the GitHub login; the git log below is only a
          # fallback so changelog trouble can never block a release.
          if [ -n "$prev" ]; then
            bullets=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${prev}...${tag}" \
              --jq '(.commits | reverse)[] as $c | "- [`" + ($c.sha[0:7]) + "`](" + $c.html_url + ") " + ($c.commit.message | split("\n") | first) + (if $c.author != null and $c.author.login != null then " (@" + $c.author.login + ")" else "" end)' \
              2>/dev/null || true)
          else
            bullets=$(gh api "repos/${GITHUB_REPOSITORY}/commits?sha=${tag}&per_page=100" \
              --jq '(reverse)[] as $c | "- [`" + ($c.sha[0:7]) + "`](" + $c.html_url + ") " + ($c.commit.message | split("\n") | first) + (if $c.author != null and $c.author.login != null then " (@" + $c.author.login + ")" else "" end)' \
              2>/dev/null || true)
          fi
          if [ -z "$bullets" ]; then
            bullets=$(git log --pretty='- %h %s' -n 100 "${prev:+${prev}..}${tag}")
          fi

          {
            echo "## Commits"
            echo
            echo "$bullets"
            if [ -n "$prev" ]; then
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            fi
          } > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "NooBoo ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
